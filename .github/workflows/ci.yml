name: Scientific and application checks
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: uv sync --frozen
      - run: uv run --frozen ruff check packages services scripts tests
      - run: uv run --frozen ruff format --check packages services scripts tests
      - run: uv run --frozen mypy packages services --explicit-package-bases
      - run: uv run --frozen pytest -q
      - run: npm ci && npm run lint && npm run build
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: npm run test:e2e
        working-directory: apps/web
        env:
          STRATOS_E2E_DATA_DIR: /tmp/stratos-ci
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-evidence
          path: apps/web/test-results
