[project]
name = "stratos-engineering"
version = "0.1.0"
description = "Local-first atmospheric mission engineering — P0/P1"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.135,<0.142", "uvicorn>=0.41,<0.53", "pydantic>=2.12,<3",
  "numpy>=2.3,<3", "scipy>=1.16,<2", "xarray>=2025.1",
  "cfgrib==0.9.15.1", "eccodes==2.50.0", "eccodeslib==2.50.0.33; sys_platform != 'win32'", "geographiclib>=2.1,<3",
  "sqlalchemy>=2.0,<3", "alembic>=1.17,<2", "httpx>=0.28,<0.29", "pyyaml>=6,<7"
]

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14", "mypy>=1.18", "types-PyYAML>=6", "types-requests>=2"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
